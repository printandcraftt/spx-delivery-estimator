<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPX Delivery Estimator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header class="header">
        <div class="logo">📦</div>

        <h1>SPX Delivery Estimator</h1>

        <p>Estimate SPX Delivery Anywhere in the Philippines</p>

        <div class="origin-card">
            <span>📍 Origin</span>
            <strong>Monkayo, Davao de Oro</strong>
        </div>
    </header>

    <main>

        <!-- Province Screen -->
        <section id="provinceScreen" class="card">

            <h2>Select Province</h2>

            <input
                type="text"
                id="provinceSearch"
                placeholder="Search province..."
                autocomplete="off"
            >

            <div id="provinceList"></div>

        </section>

        <!-- Municipality Screen -->
        <section id="municipalityScreen" class="card" style="display:none;">

            <button id="backProvince">← Back</button>

            <h2 id="selectedProvince"></h2>

            <input
                type="text"
                id="municipalitySearch"
                placeholder="Search municipality..."
                autocomplete="off"
            >

            <div id="municipalityList"></div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
